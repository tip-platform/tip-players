name: "Runtime Validation"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      app_port:
        required: true
        type: string
      health_port:
        required: true
        type: string
      db_pj_port:
        required: true
        type: string
      db_user:
        required: true
        type: string
      db_pj_name:
        required: true
        type: string

    secrets:
      sql_password:
        required: true

permissions:
  contents: read

concurrency:
  group: pr-develop-smoke-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  grpc_smoke:
    name: "Runtime Validation — gRPC Smoke"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_PORT: ${{ inputs.APP_PORT }}
      HEALTH_PORT: ${{ inputs.HEALTH_PORT }}
      DB_PJ_PORT: ${{ inputs.DB_PJ_PORT }}
      GRPC_ADDR: :50051
      HEALTH_ADDR: :8080
      HEALTH_ENABLED: "true"
      APP_ENV: staging
      DB_USER: ${{ inputs.DB_USER }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      DB_PJ_NAME: ${{ inputs.DB_PJ_NAME }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Install grpc tooling (grpcurl)
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3

      - name: Set minimal permissions for CI scripts
        shell: bash
        run: |
          chmod 500 command/ci/env-validate.sh
          chmod 500 command/ci/env-create.sh
          chmod 500 command/ci/compose-up.sh
          chmod 500 command/ci/grpc-smoke.sh
          chmod 500 command/ci/compose-down-and-clean.sh

      - name: Validate staging vars/secrets
        shell: bash
        run: command/ci/env-validate.sh

      - name: Create .env (temporary)
        shell: bash
        run: command/ci/env-create.sh

      - name: Compose up (build + start)
        shell: bash
        run: command/ci/compose-up.sh

      - name: gRPC smoke (health)
        shell: bash
        run: command/ci/grpc-smoke.sh

      - name: Compose down + cleanup
        if: always()
        shell: bash
        run: command/ci/compose-down-and-clean.sh
