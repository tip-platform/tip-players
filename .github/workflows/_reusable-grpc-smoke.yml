name: grpc_smoke

on:
  workflow_call:
    secrets:
      SQL_PASSWORD:
        required: true
    inputs:
      ref:
        required: true
        type: string
      environment:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-develop-smoke-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  grpc_smoke:
    name: "Runtime Validation — gRPC Smoke"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      APP_PORT: ${{ vars.APP_PORT }}
      HEALTH_PORT: ${{ vars.HEALTH_PORT }}
      DB_PJ_PORT: ${{ vars.DB_PJ_PORT }}
      GRPC_ADDR: :50051
      HEALTH_ADDR: :8080
      HEALTH_ENABLED: "true"
      APP_ENV: staging
      COMPOSE_RESTART_POLICY: no
      DB_USER: ${{ vars.DB_USER }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      DB_PJ_NAME: ${{ vars.DB_PJ_NAME }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-go

      - name: Install grpc tooling (grpcurl)
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3

      - name: Validate staging vars/secrets
        uses: ./.github/actions/scripting
        with:
          script: env-validate.sh

      - name: Create .env (temporary)
        uses: ./.github/actions/scripting
        with:
          script: env-create.sh

      - name: Compose up (build + start)
        uses: ./.github/actions/scripting
        with:
          script: compose-up.sh

      - name: gRPC smoke (health)
        uses: ./.github/actions/scripting
        with:
          script: grpc-smoke.sh

      - name: Compose down + cleanup
        uses: ./.github/actions/scripting
        if: always()
        with:
          script: compose-down-and-clean.sh
