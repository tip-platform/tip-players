name: "PR (develop) — Quality Gates"

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scm_policy_conventional_commits:
    name: "SCM Policy — Conventional Commits"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Install commitlint
        run: npm install -D @commitlint/cli @commitlint/config-conventional

      - name: Validate commit messages
        run: |
          npx commitlint --from --config=config/.commitlintrc.json \
                        ${{ github.event.pull_request.base.sha }} \
                        --to ${{ github.event.pull_request.head.sha }} \
                        --verbose

  build_verification_compile:
    name: "Build Verification — Compile"
    runs-on: ubuntu-24.04
    needs: [scm_policy_conventional_commits]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

  static_code_quality_golangci_lint:
    name: "Static Code Quality — golangci-lint"
    runs-on: ubuntu-24.04
    needs: [scm_policy_conventional_commits]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          install-mode: goinstall
          args: --timeout=5m --config=config/.golangci.yml

  runtime_validation_grpc_smoke_load:
    name: "Runtime Validation — gRPC Smoke"
    runs-on: ubuntu-24.04
    environment: staging
    needs: [build_verification_compile]
    timeout-minutes: 15
    env:
      APP_PORT: ${{ vars.APP_PORT }}
      HEALTH_PORT: ${{ vars.HEALTH_PORT }}
      DB_PJ_PORT: ${{ vars.DB_PJ_PORT }}
      GRPC_ADDR: :50051
      HEALTH_ADDR: :8080
      HEALTH_ENABLED: "true"
      APP_ENV: staging
      DB_USER: ${{ vars.DB_USER }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      DB_PJ_NAME: ${{ vars.DB_PJ_NAME }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Install grpc tooling (grpcurl)
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3

      - name: Compose up (build + start)
        run: docker compose -f build/compose.yml up -d --build

      - name: gRPC smoke (health)
        run: |
          for i in $(seq 1 30); do
            if grpcurl -plaintext localhost:${APP_PORT} grpc.health.v1.Health/Check >/dev/null 2>&1; then
              break
            fi
          done
          grpcurl -plaintext localhost:${APP_PORT} grpc.health.v1.Health/Check

      - name: Compose down
        if: always()
        run: docker compose -f build/compose.yml down -v
