name: "PR (develop) — Quality Gates"

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scm_policy_conventional_commits:
    name: "SCM Policy — Conventional Commits"
    uses: ./.github/workflows/_reusable-commitlint.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  build_verification_compile:
    name: "Build Verification — Compile"
    needs: [scm_policy_conventional_commits]
    uses: ./.github/workflows/_reusable-build-compile.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  static_code_quality_golangci_lint:
    name: "Static Code Quality — golangci-lint"
    needs: [scm_policy_conventional_commits]
    uses: ./.github/workflows/_reusable-golangci_lint.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  staging_gate:
    name: "Staging Gate — Unlock Environment"
    needs: [build_verification_compile]
    runs-on: ubuntu-24.04
    environment: staging
    outputs:
      app_port: ${{ vars.APP_PORT }}
      health_port: ${{ vars.HEALTH_PORT }}
      db_pj_port: ${{ vars.DB_PJ_PORT }}
      db_user: ${{ vars.DB_USER }}
      db_pj_name: ${{ vars.DB_PJ_NAME }}
    steps:
      - run: echo "staging unlocked"

  runtime_validation_grpc_smoke_load:
    name: "Runtime Validation — gRPC Smoke"
    needs: [staging_gate]
    uses: ./.github/workflows/_reusable-grpc-smoke.yml
    secrets:
      sql_password: ${{ secrets.SQL_PASSWORD }}
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      app_port: ${{ vars.APP_PORT }}
      health_port: ${{ vars.HEALTH_PORT }}
      db_pj_port: ${{ vars.DB_PJ_PORT }}
      db_user: ${{ vars.DB_USER }}
      db_pj_name: ${{ vars.DB_PJ_NAME }}
