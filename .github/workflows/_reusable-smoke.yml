name: "Runtime Validation"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime_validation_grpc_smoke_load:
    name: "Runtime Validation — gRPC Smoke"
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    env:
      APP_PORT: ${{ vars.APP_PORT }}
      HEALTH_PORT: ${{ vars.HEALTH_PORT }}
      DB_PJ_PORT: ${{ vars.DB_PJ_PORT }}
      GRPC_ADDR: :50051
      HEALTH_ADDR: :8080
      HEALTH_ENABLED: "true"
      APP_ENV: staging
      DB_USER: ${{ vars.DB_USER }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      DB_PJ_NAME: ${{ vars.DB_PJ_NAME }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Install grpc tooling (grpcurl)
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3

      - name: Compose up (build + start)
        run: docker compose -f build/compose.yml up -d --build

      - name: gRPC smoke (health)
        run: |
          for i in $(seq 1 30); do
            if grpcurl -plaintext localhost:${APP_PORT} grpc.health.v1.Health/Check >/dev/null 2>&1; then
              break
            fi
          done
          grpcurl -plaintext localhost:${APP_PORT} grpc.health.v1.Health/Check

      - name: Compose down
        if: always()
        run: docker compose -f build/compose.yml down -v
