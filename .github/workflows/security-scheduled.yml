name: "Security (Scheduled) — Container/Image Vulnerability Scanning | SAST"

on:
  schedule:
    - cron: 0 11 * * 1
  workflow_dispatch:

concurrency:
  group: security-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  container_image_vulnerability_scanning:
    name: "Container/Image Vulnerability Scanning — Trivy"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Build an image from Dockerfile
        run: docker build -t repo-scan:${{ github.sha }} -f build/ContainerFile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: repo-scan:${{ github.sha }}
          format: sarif
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: 1
          vuln-type: "os,library"
          output: trivy-results.sarif

      - name: Trivy — upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  sast_sonarqube:
    name: "SAST — SonarQube"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: "aws connection service"
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::006834263887:role/github-actions-tip-players
          aws-region: us-east-2

      - name: Load SONAR_TOKEN Secrets Manager
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "tip-players/config" \
            --query "SecretString" \
            --output text)
          SONAR_TOKEN=$(echo $SECRET_JSON | jq -r '.SONAR_TOKEN')
          echo "SONAR_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=tip-platform
            -Dsonar.projectName=tip-platform
            -Dsonar.projectKey=tip-platform
            -Dsonar.sources=cmd,internal
            -Dsonar.verbose=true
