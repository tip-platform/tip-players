name: "_reusable — Build Compile"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  compile:
    name: "Build Verification — Compile"
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-checkout

      - uses: ./.github/actions/setup-go

      - name: go build
        run: go build ./...
