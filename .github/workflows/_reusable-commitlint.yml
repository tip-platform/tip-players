name: conventional_commits

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  commitlint:
    name: Commilint
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-checkout

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Install commitlint
        run: npm install -D @commitlint/cli @commitlint/config-conventional

      - name: Validate commit messages
        run: |
          npx commitlint --config=config/.commitlintrc.json \
                        --from ${{ inputs.base_sha }} \
                        --to ${{ inputs.head_sha }} \
                        --verbose
