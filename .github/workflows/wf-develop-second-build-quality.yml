name: "PR (develop) — Build & Quality"

on:
  workflow_run:
    workflows: ["PR (develop) — Conventional Commits"]
    types: [completed]

permissions:
  contents: read

jobs:
  build_verification_compile:
    name: "Build Verification — Compile"
    runs-on: ubuntu-24.04
    needs: [scm_policy_conventional_commits]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

  static_code_quality_golangci_lint:
    name: "Static Code Quality — golangci-lint"
    runs-on: ubuntu-24.04
    needs: [scm_policy_conventional_commits]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          install-mode: goinstall
          args: --timeout=5m --config=config/.golangci.yml
