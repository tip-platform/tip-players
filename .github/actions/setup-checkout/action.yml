name: "Checkout"

description: "actions/checkout with fetch-depth conf"

inputs:
  ref:
    description: "SHA o ref a checkout"
  fetch-depth:
    description: "fetch-depth configurable"
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
