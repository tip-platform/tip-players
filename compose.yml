services:
  app:
    build:
      context: .
      dockerfile: ContainerFile
    ports:
      - "${APP_PORT}:50051"
      - "${HEALTH_PORT:-8080}:8080"
    env_file: .env
    environment:
      - DB_PJ_HOST=db-player
      - DB_PJ_PORT=1433
      - DB_USER=${DB_USER}
      - SQL_PASSWORD=${SQL_PASSWORD}
      - DB_PJ_NAME=${DB_PJ_NAME}

      - GRPC_ADDR=:50051
      - HEALTH_ADDR=:8080
    depends_on:
      - db-player

  db-player:
    container_name: mssql_player_db
    image: mcr.microsoft.com/mssql/server:2025-latest
    stop_grace_period: 5s
    ports:
      - "${DB_PJ_PORT}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - player_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  player_data:
