# Documentación: https://golangci-lint.run/usage/configuration/

version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # ── Correctness
    - govet
    - errcheck
    - staticcheck
    - contextcheck
    - rowserrcheck
    - gosimple
    - ineffassign
    - unused

    # ── Style / Formatting
    - gofmt
    - goimports
    - misspell
    - whitespace

    # ── Bugs potenciales
    - nilnil
    - nilerr
    - unparam

    # ── Seguridad
    - gosec

  settings:
    errcheck:
      check-type-assertions: true

    govet:
      enable-all: true
      disable:
        - fieldalignment

    staticcheck:
      checks: [all]

    gosec:
      excludes: [G104]

    exhaustive:
      default-signifies-exhaustive: true

issues:
  max-same-issues: 5
